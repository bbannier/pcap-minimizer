name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: tshark
          version: 1.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      # On ubuntu tshark is confined by AppArmor and cannot read files
      # from arbitrary paths like the CI workspace.
      - run: sudo apparmor_parser -R /etc/apparmor.d/tshark
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3
      - name: Test
        run: cargo test

  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3
        with:
          components: clippy,rustfmt
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d #v3.1.0
